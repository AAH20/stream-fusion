name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
      - run: cargo run --release -p stream-fusion-cli -- benchmark --events 10000 --concurrency-batch 500
      - run: cargo run --release -p stream-fusion-cli -- audit-skew --daily-gmv 10000000 --baseline-ctr 0.045 --simulated-lag-ms 25000 --staleness-degradation-pct-per-1000ms 0.3 --margin-attribution 0.35
